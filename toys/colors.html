<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>随机配色卡</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    display:flex;flex-direction:column;background:#0a0a0c;color:#fff;
    font-family:"Noto Sans SC","PingFang SC",system-ui,sans-serif;
    overflow:hidden;user-select:none;
  }
  .bar{
    display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
    background:#0a0a0c;position:relative;z-index:2
  }
  .bar .t{font-size:14px;letter-spacing:.06em;color:#9aa3ad;flex:1}
  .bar .n{font:12px ui-monospace,monospace;color:#4a5158}
  button{
    border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;
    padding:9px 14px;border-radius:11px;font:13px system-ui;letter-spacing:.04em;
    transition:transform .1s,background .15s
  }
  button:active{transform:scale(.95)}
  #stack{flex:1;display:flex;flex-direction:column;min-height:0}
  .sw{flex:1;display:flex;align-items:flex-end;justify-content:space-between;
     padding:0 18px 14px;position:relative;transition:flex-grow .35s,background .35s;cursor:pointer;overflow:hidden}
  .sw .hex{font:600 17px/1 ui-monospace,monospace;letter-spacing:.08em;text-shadow:0 1px 12px rgba(0,0,0,.28)}
  .sw .hsl{font:11px ui-monospace,monospace;opacity:.72;letter-spacing:.04em}
  .sw:active{flex-grow:1.35}
  .toast{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,14px);
    background:rgba(10,10,12,.88);border:1px solid rgba(255,255,255,.18);padding:9px 16px;border-radius:999px;
    font-size:13px;opacity:0;transition:.25s;pointer-events:none;backdrop-filter:blur(8px);z-index:9
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
  <div class="bar">
    <div class="t">随机配色卡</div>
    <div class="n" id="scheme">—</div>
    <button id="shuffle">换一组</button>
  </div>
  <div id="stack"></div>
  <div class="toast" id="toast"></div>
<script>
(function () {
  const stack = document.getElementById('stack');
  const schemeEl = document.getElementById('scheme');
  const toastEl = document.getElementById('toast');
  const SCHEMES = ['邻近色', '互补色', '三分色', '单色渐变', '分裂互补'];
  let palette = [];

  const rnd = (a, b) => a + Math.random() * (b - a);

  function hsl2hex(h, s, l) {
    h = ((h % 360) + 360) % 360; s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    const to = x => Math.round(255 * x).toString(16).padStart(2, '0');
    return '#' + to(f(0)) + to(f(8)) + to(f(4));
  }

  function build() {
    const base = rnd(0, 360);
    const kind = Math.floor(Math.random() * SCHEMES.length);
    const hues = [];
    for (let i = 0; i < 5; i++) {
      if (kind === 0) hues.push(base + i * rnd(10, 22));
      else if (kind === 1) hues.push(i < 3 ? base + i * rnd(4, 10) : base + 180 + (i - 3) * 8);
      else if (kind === 2) hues.push(base + (i % 3) * 120 + (i > 2 ? 18 : 0));
      else if (kind === 3) hues.push(base + rnd(-6, 6));
      else hues.push(i < 3 ? base + i * 12 : base + 150 + (i - 3) * 14);
    }
    const lights = [rnd(18, 26), rnd(34, 42), rnd(50, 58), rnd(66, 74), rnd(82, 90)];
    palette = hues.map((h, i) => {
      const s = Math.round(rnd(52, 88));
      const l = Math.round(lights[(i + Math.floor(rnd(0, 5))) % 5]);
      return { h: Math.round(((h % 360) + 360) % 360), s, l, hex: hsl2hex(h, s, l) };
    });
    palette.sort((a, b) => a.l - b.l);
    schemeEl.textContent = SCHEMES[kind];
    render();
  }

  function render() {
    stack.innerHTML = '';
    palette.forEach(c => {
      const d = document.createElement('div');
      d.className = 'sw';
      d.style.background = c.hex;
      const dark = c.l > 62;
      d.style.color = dark ? '#12141a' : '#f4f6fa';
      d.innerHTML = `<div><div class="hex">${c.hex.toUpperCase()}</div>
        <div class="hsl">hsl(${c.h} ${c.s}% ${c.l}%)</div></div>`;
      d.addEventListener('click', () => copy(c.hex.toUpperCase()));
      stack.appendChild(d);
    });
  }

  async function copy(txt) {
    try { await navigator.clipboard.writeText(txt); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = txt; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (_) {}
      ta.remove();
    }
    toastEl.textContent = '已复制 ' + txt;
    toastEl.classList.add('on');
    clearTimeout(copy._t);
    copy._t = setTimeout(() => toastEl.classList.remove('on'), 1100);
    if (navigator.vibrate) navigator.vibrate(8);
  }

  document.getElementById('shuffle').onclick = build;
  addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); build(); } });
  build();
})();
</script>
</body>
</html>
