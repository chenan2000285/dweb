<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b10">
<title>今天去哪了</title>
<style>
  :root{ --fg:#eef4ff; --muted:#7d8ba1; --line:rgba(255,255,255,.08); }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{margin:0;height:100%}
  body{
    background:#080b10;color:var(--fg);overflow:hidden;
    font-family:"Noto Sans SC","PingFang SC",system-ui,sans-serif;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 24px calc(env(safe-area-inset-bottom));
    transition:background 2s ease
  }
  .glow{position:fixed;inset:-20% -20% auto;height:70%;pointer-events:none;filter:blur(70px);opacity:.55;transition:background 2s ease}
  .wrap{position:relative;z-index:1;display:flex;flex-direction:column;gap:34px}
  .clock{display:flex;align-items:baseline;gap:2px;font-family:ui-monospace,SFMono-Regular,monospace;letter-spacing:-.02em}
  .clock .h{font-size:clamp(58px,21vw,96px);font-weight:600;line-height:.95;font-variant-numeric:tabular-nums}
  .clock .s{font-size:clamp(15px,4.4vw,20px);color:var(--muted);margin-left:8px;font-variant-numeric:tabular-nums}
  .date{font-size:14px;color:var(--muted);letter-spacing:.14em;margin-top:-18px}
  .bars{display:flex;flex-direction:column;gap:20px}
  .bar .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .bar .name{font-size:12px;letter-spacing:.18em;color:var(--muted)}
  .bar .val{font:600 13px ui-monospace,monospace;color:var(--fg);font-variant-numeric:tabular-nums}
  .track{height:6px;border-radius:999px;background:rgba(255,255,255,.07);overflow:hidden}
  .fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#4fe3c1,#6aa8ff);transition:width .8s cubic-bezier(.2,.8,.2,1)}
  .fill.year{background:linear-gradient(90deg,#ffb86b,#ff7a90)}
  .foot{position:fixed;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom));text-align:center;font-size:11px;color:#3f4a5c;letter-spacing:.16em}
</style>
</head>
<body>
  <div class="glow" id="glow"></div>
  <div class="wrap">
    <div>
      <div class="clock"><span class="h" id="hm">00:00</span><span class="s" id="ss">00</span></div>
      <div class="date" id="date">—</div>
    </div>
    <div class="bars">
      <div class="bar">
        <div class="top"><span class="name">今天</span><span class="val" id="dayv">0%</span></div>
        <div class="track"><div class="fill" id="dayf"></div></div>
      </div>
      <div class="bar">
        <div class="top"><span class="name">今年</span><span class="val" id="yearv">0%</span></div>
        <div class="track"><div class="fill year" id="yearf"></div></div>
      </div>
    </div>
  </div>
  <div class="foot" id="foot">—</div>
<script>
(function () {
  const hmEl = document.getElementById('hm');
  const ssEl = document.getElementById('ss');
  const dateEl = document.getElementById('date');
  const dayf = document.getElementById('dayf'), dayv = document.getElementById('dayv');
  const yearf = document.getElementById('yearf'), yearv = document.getElementById('yearv');
  const glow = document.getElementById('glow');
  const foot = document.getElementById('foot');
  const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
  const pad = n => String(n).padStart(2, '0');

  function tick() {
    const now = new Date();
    const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
    hmEl.textContent = pad(h) + ':' + pad(m);
    ssEl.textContent = pad(s);

    const y = now.getFullYear(), mo = now.getMonth(), d = now.getDate();
    dateEl.textContent = `${y} 年 ${mo + 1} 月 ${d} 日　${WEEK[now.getDay()]}`;

    const dayP = ((h * 3600 + m * 60 + s) / 86400) * 100;
    dayf.style.width = dayP.toFixed(2) + '%';
    dayv.textContent = dayP.toFixed(1) + '%';

    const start = new Date(y, 0, 1);
    const end = new Date(y + 1, 0, 1);
    const yearP = ((now - start) / (end - start)) * 100;
    yearf.style.width = yearP.toFixed(2) + '%';
    yearv.textContent = yearP.toFixed(1) + '%';

    // 早上偏青、白天偏蓝、黄昏偏橙、夜里偏紫
    const hue = h < 5 ? 265 : h < 9 ? 180 : h < 17 ? 215 : h < 20 ? 32 : 265;
    glow.style.background = `radial-gradient(60% 100% at 50% 0%,hsl(${hue},70%,45%),transparent 70%)`;

    const left = 24 * 60 - (h * 60 + m);
    foot.textContent = left > 0 ? `距离零点还有 ${Math.floor(left / 60)} 小时 ${left % 60} 分` : '新的一天';
  }

  tick();
  setInterval(tick, 1000);
  if (navigator.setWakeLock) {}
})();
</script>
</body>
</html>
