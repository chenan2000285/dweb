<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>星空 · 指尖引力</title>
<style>
  html,body{margin:0;height:100%;background:#05070f;overflow:hidden;touch-action:none}
  canvas{display:block;width:100%;height:100%}
  .tip{
    position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));
    text-align:center;color:#5c6d8f;font:13px/1.6 system-ui,sans-serif;
    letter-spacing:.08em;pointer-events:none;transition:opacity 1.2s;user-select:none
  }
  .hud{
    position:fixed;top:calc(16px + env(safe-area-inset-top));left:0;right:0;
    text-align:center;color:#3d4a66;font:11px/1.4 ui-monospace,monospace;
    letter-spacing:.2em;pointer-events:none;user-select:none
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud" id="hud">TAP &amp; HOLD</div>
<div class="tip" id="tip">按住屏幕，星星会朝指尖聚拢</div>
<script>
(function () {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const tip = document.getElementById('tip');
  const hud = document.getElementById('hud');
  let W = 0, H = 0, dpr = 1;
  let stars = [];
  let pointer = { x: 0, y: 0, down: false, active: false };
  let swirled = false;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = Math.round(W * dpr);
    cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const target = Math.min(220, Math.round(W * H / 4200));
    while (stars.length < target) stars.push(makeStar());
    stars.length = target;
  }

  function makeStar(x, y) {
    return {
      x: x === undefined ? Math.random() * W : x,
      y: y === undefined ? Math.random() * H : y,
      vx: (Math.random() - 0.5) * 0.22,
      vy: (Math.random() - 0.5) * 0.22,
      r: 0.5 + Math.random() * 1.7,
      hue: 200 + Math.random() * 80,
      tw: Math.random() * Math.PI * 2
    };
  }

  function step() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(5,7,15,0.32)';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    for (const s of stars) {
      if (pointer.active) {
        const dx = pointer.x - s.x, dy = pointer.y - s.y;
        const d2 = dx * dx + dy * dy;
        const d = Math.sqrt(d2) || 1;
        const force = pointer.down ? 2600 / (d2 + 900) : -900 / (d2 + 900);
        s.vx += (dx / d) * force * 0.6;
        s.vy += (dy / d) * force * 0.6;
        // 切向扰动，形成漩涡感
        s.vx += (-dy / d) * force * 0.35;
        s.vy += (dx / d) * force * 0.35;
      }
      s.vx *= 0.982; s.vy *= 0.982;
      s.x += s.vx; s.y += s.vy;
      s.tw += 0.02 + s.r * 0.01;

      if (s.x < -20) s.x = W + 20; else if (s.x > W + 20) s.x = -20;
      if (s.y < -20) s.y = H + 20; else if (s.y > H + 20) s.y = -20;

      const a = 0.35 + Math.sin(s.tw) * 0.25;
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 4.5);
      g.addColorStop(0, `hsla(${s.hue},95%,78%,${a})`);
      g.addColorStop(1, `hsla(${s.hue},95%,60%,0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r * 4.5, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(step);
  }

  function pos(e) {
    const t = e.touches ? e.touches[0] : e;
    pointer.x = t.clientX; pointer.y = t.clientY;
  }

  cv.addEventListener('pointerdown', e => {
    pointer.active = true; pointer.down = true; pos(e);
    if (!swirled) {
      swirled = true;
      tip.style.opacity = '0';
      hud.textContent = 'DRAG TO SWIRL';
      setTimeout(() => { hud.textContent = ''; }, 1800);
    }
  });
  cv.addEventListener('pointermove', e => { pointer.active = true; pos(e); });
  const up = () => { pointer.down = false; };
  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);
  cv.addEventListener('pointerleave', () => { pointer.active = false; pointer.down = false; });

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
