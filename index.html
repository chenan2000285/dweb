<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080c14">
<title>dweb · 陈安的网页仓库</title>
<style>
  :root{
    --bg:#080c14; --card:rgba(255,255,255,.04); --line:rgba(255,255,255,.09);
    --text:#e9eefa; --muted:#8492a8; --accent:#4fe3c1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{
    background:
      radial-gradient(800px 420px at 15% -8%,#16324f 0%,transparent 62%),
      radial-gradient(700px 420px at 95% 8%,#2a1a3d 0%,transparent 60%),
      var(--bg);
    color:var(--text);font-family:"Noto Sans SC","PingFang SC",system-ui,sans-serif;
    padding:calc(30px + env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom));
    min-height:100vh;display:flex;flex-direction:column;gap:22px
  }
  .head h1{margin:0 0 8px;font-size:26px;letter-spacing:.06em}
  .head h1 span{color:var(--accent)}
  .head p{margin:0;font-size:13px;color:var(--muted);letter-spacing:.05em;line-height:1.6}
  .grid{display:flex;flex-direction:column;gap:12px}
  a.card{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;
    transition:transform .12s,border-color .2s,background .2s
  }
  a.card:active{transform:scale(.98);background:rgba(255,255,255,.07)}
  .ico{
    width:46px;height:46px;flex:none;border-radius:13px;display:grid;place-items:center;font-size:22px;
    background:linear-gradient(160deg,rgba(79,227,193,.16),rgba(106,168,255,.1));
    border:1px solid rgba(79,227,193,.18)
  }
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-size:15.5px;font-weight:600;letter-spacing:.02em}
  .txt span{display:block;font-size:12.5px;color:var(--muted);margin-top:3px;line-height:1.5}
  .arrow{color:#445268;font-size:18px}
  .foot{margin-top:auto;font-size:11.5px;color:#43506a;letter-spacing:.08em;line-height:1.9}
  .foot a{color:#5d6f8c;text-decoration:none;border-bottom:1px solid #2a3446}
</style>
</head>
<body>
  <header class="head">
    <h1>这是 <span>dweb</span></h1>
    <p>陈安的网页小仓库 · 纯 HTML/CSS/JS，不联网也能跑</p>
  </header>

  <nav class="grid">
    <a class="card" href="clicker/">
      <div class="ico">🖱</div>
      <div class="txt"><b>开源点击游戏</b><span>一直点，解锁场景与成就</span></div>
      <div class="arrow">›</div>
    </a>
    <a class="card" href="toys/">
      <div class="ico">✦</div>
      <div class="txt"><b>小玩意儿</b><span>星空引力、摩尔斯电报、配色卡、时钟</span></div>
      <div class="arrow">›</div>
    </a>
  </nav>

  <footer class="foot">
    源码仓库：<a href="https://github.com/chenan2000285/dweb">github.com/chenan2000285/dweb</a><br>
    本地文件在 <code>/sdcard/aiweb/</code>
  </footer>
</body>
</html>
